name: Branch Build & Push

# Build and push a TEST Docker image + Helm chart from feature/fix branches, so a
# branch can be deployed for testing without merging to main or cutting a release.
# Intentionally does NOT touch the `latest` tag or stable chart versions — those are
# owned by the Release workflow (release.yml, which runs on main pushes and v* tags).

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.vars.outputs.sha7 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Branch ref tag (e.g. feat-foo) + short commit SHA. No `latest`.
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package & Push Helm Chart (pre-release)
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Compute lowercase owner + image repository
        id: repo
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Stamp pre-release chart version + branch image
        run: |
          SHA7="${{ needs.docker.outputs.sha7 }}"
          BASE=$(grep '^version:' deploy/helm/routeboard/Chart.yaml | awk '{print $2}')
          PREREL="${BASE}-dev.${SHA7}"
          # Chart version becomes a SemVer pre-release; appVersion (the default image
          # tag) points at the branch image's short-SHA tag pushed by the docker job.
          sed -i "s/^version:.*/version: ${PREREL}/" deploy/helm/routeboard/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${SHA7}\"/" deploy/helm/routeboard/Chart.yaml
          sed -i "s|^  repository:.*|  repository: ${{ steps.repo.outputs.image }}|" deploy/helm/routeboard/values.yaml
          echo "chart version: ${PREREL}  |  appVersion/image tag: ${SHA7}  |  image: ${{ steps.repo.outputs.image }}"

      - name: Package Helm chart
        run: helm package deploy/helm/routeboard -d /tmp/helm-pkg

      - name: Push Helm chart to GHCR (OCI)
        run: helm push /tmp/helm-pkg/routeboard-*.tgz oci://${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/helm