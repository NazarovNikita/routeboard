suite: Deployment (image, env, scheduling)
templates:
  - templates/deployment.yaml
tests:
  - it: defaults the image tag to the chart appVersion
    chart:
      appVersion: 9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/dhia-gharsallaoui/routeboard:9.9.9

  - it: uses image.tag when set
    set:
      image:
        tag: edge
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/dhia-gharsallaoui/routeboard:edge

  - it: maps structural config to ROUTEBOARD_* env vars
    set:
      config:
        watchIngress: false
        watchHTTPRoute: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROUTEBOARD_WATCH_INGRESS
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROUTEBOARD_WATCH_HTTPROUTE
            value: "true"

  - it: does not render passthrough env vars unless set via extraEnv
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ROUTEBOARD_TITLE
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: ROUTEBOARD_HEALTH_ENABLED

  - it: renders extraEnv entries into the container env
    set:
      extraEnv:
        - name: ROUTEBOARD_HEALTH_ENABLED
          value: "false"
        - name: ROUTEBOARD_TITLE
          value: My Board
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROUTEBOARD_HEALTH_ENABLED
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ROUTEBOARD_TITLE
            value: My Board

  - it: renders priorityClassName and topologySpreadConstraints when set
    set:
      priorityClassName: high-priority
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: high-priority
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: omits priorityClassName and topologySpreadConstraints by default
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: defaults to a single replica and uses the selector labels
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: routeboard
